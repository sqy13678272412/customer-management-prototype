<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录 - 罗开科公司CRM系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1c6dd9 0%, #2b7af5 50%, #5aa0ff 100%);
  }
  .login-card {
    width: 400px; background: #fff; border-radius: 10px;
    padding: 40px 36px 32px; box-shadow: 0 12px 40px rgba(0, 0, 0, .18);
  }
  .login-logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
  .login-logo .logo-icon {
    width: 40px; height: 40px; border-radius: 8px; background: #2b7af5; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600;
  }
  .login-logo span { font-size: 18px; font-weight: 600; color: #303133; }
  .login-sub { text-align: center; font-size: 13px; color: #909399; margin-bottom: 28px; }
  .form-item { margin-bottom: 18px; }
  .form-item label { display: block; font-size: 13px; color: #606266; margin-bottom: 8px; }
  .form-item input {
    width: 100%; height: 40px; border: 1px solid #dcdfe6; border-radius: 4px;
    padding: 0 12px; font-size: 14px; color: #303133; outline: none; transition: border-color .2s;
  }
  .form-item input:focus { border-color: #2b7af5; }
  .login-btn {
    width: 100%; height: 42px; border: none; border-radius: 4px; margin-top: 6px;
    background: #2b7af5; color: #fff; font-size: 15px; cursor: pointer;
  }
  .login-btn:hover { background: #4a8ef7; }
  .login-footer { text-align: center; font-size: 12px; color: #c0c4cc; margin-top: 22px; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">罗</div>
      <span>罗开科公司CRM系统</span>
    </div>
    <div class="login-sub">欢迎登录，请输入您的账号信息</div>
    <div class="form-item">
      <label>用户名</label>
      <input id="loginUser" value="罗开科" placeholder="请输入用户名">
    </div>
    <div class="form-item">
      <label>密码</label>
      <input id="loginPwd" type="password" value="111111" placeholder="请输入密码">
    </div>
    <button class="login-btn" id="loginBtn">登 录</button>
    <div class="login-footer">© 2026 罗开科公司 · 版权所有</div>
  </div>
  <script>
    document.getElementById('loginBtn').addEventListener('click', function () {
      location.href = 'index.html';
    });
  </script>
</body>
</html>
